aid: catchpoint
name: Catchpoint
description: >-
  Catchpoint is a leading Internet Performance Monitoring (IPM) company. Its platform
  combines the largest independent global observability network (thousands of
  synthetic agents across 100+ countries plus BGP peers) with synthetic monitoring,
  real user monitoring (RUM), BGP monitoring, endpoint/workforce monitoring, tracing,
  and Internet Sonar to give teams end-to-end visibility across the entire Internet
  Stack — networks, DNS, CDN, SASE, and third-party services — from the end-user
  perspective. Catchpoint exposes a REST API v2 (bearer API key, JSON) for managing
  synthetic tests, monitoring nodes and node groups, products/folders, alerts,
  contacts, SLOs, insights, and usage reporting, plus alert/test-data/BGP webhooks
  and an official Terraform provider. Catchpoint is a portfolio company of Sapphire
  Ventures.
