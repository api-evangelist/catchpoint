openapi: 3.2.0
info:
  title: Catchpoint REST API v2.0 Contacts API
  version: '2.0'
servers:
- url: /api
tags:
- name: Contacts
paths:
  /v2/contacts/{contactIds}:
    get:
      tags:
      - Contacts
      summary: Return contact details by the IDs passed
      parameters:
      - name: contactIds
        in: path
        description: Comma-separated list of contact IDs
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactGetResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactGetResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactGetResponse'
      security:
      - bearer: []
      order: 1
      operationId: getV2ContactsByContactIds
      x-operation-id-source: derived
  /v2/contacts:
    get:
      tags:
      - Contacts
      summary: Returns Contact details by parameters passed
      description: If no parameters are passed all “Active” contacts are returned.
      parameters:
      - name: statusId
        in: query
        description: Contact Status Type. “0” for Active; “1” for Inactive.
        schema:
          type: integer
          format: int32
      - name: divisionId
        in: query
        description: Division ID
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: Page number to return records from when the number of records exceeds pageSize
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Number of results per page. Maximum value is 100.
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactGetResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactGetResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactGetResponse'
      security:
      - bearer: []
      order: 2
      operationId: getV2Contacts
      x-operation-id-source: derived
    delete:
      tags:
      - Contacts
      summary: Deletes existing contacts by parameters passed
      description: To delete contacts based on the specified list of IDs, the IDs need to be separated by commas. This endpoint allows partial deletion; if you provide a list of five IDs and only three of them are valid, then it will delete those three contacts. The response will indicate the three that were deleted, and the two invalid IDs will be listed as errors.
      parameters:
      - name: contactIds
        in: query
        description: Comma-separated list of Contact IDs
        schema:
          type: string
      - name: email
        in: query
        description: Email of contact
        schema:
          type: string
      - name: divisionId
        in: query
        description: Division ID. If the contact to delete is within a division, provide the Division ID
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactDeleteResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactDeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactDeleteResponse'
      security:
      - bearer: []
      order: 5
      operationId: deleteV2Contacts
      x-operation-id-source: derived
    post:
      tags:
      - Contacts
      summary: Create a new contact based on the PostData
      description: To get payload for creating a new contact and to get the created contact details refer InternalLink[Contact Details by ID Endpoint,operations-tag-Contact,operations-Contact-get_v2_contacts__contactIds_]. Pass “0” for contact ID to create a new contact.
      parameters:
      - name: objectDetails
        in: query
        description: Set to true to return the created object in the response body, otherwise the response body will only return created object ID.
        schema:
          type: boolean
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactAPIModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactAPIModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactAPIModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactAPIModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactPostResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactPostResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactPostResponse'
      security:
      - bearer: []
      order: 3
      operationId: postV2Contacts
      x-operation-id-source: derived
  /v2/contacts/{contactId}:
    patch:
      tags:
      - Contacts
      summary: Update an existing contact based on the request body
      description: '**Request:**


        Only the property to be updated can be passed in the request body instead of the whole object. The update request body requires a total of three keys to be filled with appropriate value as listed below:

        * **value** – The value property provides the new value.


        * **path** – The path property indicates the element to update. The entire path with slashes needs to be provided here. Example: /status/id


        * **op** – The op property indicates the type of operation; we support the following three operations.


        * **add** - Add a property or array element. For existing property: set value.


        * **Remove** - Remove a property or array element.


        * **replace** - Same as remove followed by add at same location.


        * **from** - [Not Used]


        * **Explanation** - The "from" parameter represents the starting or current value of the resource that the operation intends to modify. The from parameter is included in the example value schema but is not utilized in this endpoint''s functionality. It is reserved for potential future use or could be used in specific scenarios not covered by the current implementation.'
      parameters:
      - name: contactId
        in: path
        description: Contact ID
        required: true
        schema:
          type: integer
          format: int32
      - name: objectDetails
        in: query
        description: Set to true to return the updated object in the response body, otherwise the response body will only return the updated object ID.
        schema:
          type: boolean
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Microsoft.AspNetCore.JsonPatch.Operations.Operation'
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Microsoft.AspNetCore.JsonPatch.Operations.Operation'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Microsoft.AspNetCore.JsonPatch.Operations.Operation'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Microsoft.AspNetCore.JsonPatch.Operations.Operation'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactPostResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactPostResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Contact.ContactPostResponse'
      security:
      - bearer: []
      order: 4
      operationId: patchV2ContactsByContactId
      x-operation-id-source: derived
