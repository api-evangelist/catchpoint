openapi: 3.0.1
info:
  title: Catchpoint REST API v2.0 Account RealUser API
  version: '2.0'
servers:
- url: /api
tags:
- name: RealUser
paths:
  /v2/realuser/favoritechart:
    get:
      tags:
      - RealUser
      summary: Returns the list of real user favorite charts from a client or a division.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartResponse]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartResponse]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartResponse]'
      security:
      - bearer: []
      order: 1
  /v2/realuser/favoritechart/{favoritechartIds}:
    get:
      tags:
      - RealUser
      summary: Returns the real user favorite chart details based on the favorite chart ID.
      parameters:
      - name: favoritechartIds
        in: path
        description: Comma-separated list of real user favorite chart IDs
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
      security:
      - bearer: []
      order: 2
  /v2/realuser/favoritechart/data/{favoriteChartId}:
    get:
      tags:
      - RealUser
      summary: Returns the real user favorite chart data based on the ID and the parameters.
      description: "*[Analytics Endpoint]*\r\n            \r\nThe favorite chart data returned is in UTC time.\r\n            \r\n**Note:**\r\n- Time interval \"Second\" is only valid for timeframes less than or equal to 30 minutes.\r\n- Similarly, time interval \"Minutes1\" is only valid for timeframes less than or equal to 12 hours.\r\n- Using these time intervals with other timeframes will result in an error response."
      parameters:
      - name: favoriteChartId
        in: path
        description: Real user favorite chart ID
        required: true
        schema:
          type: integer
          format: int32
      - name: startTimeUtc
        in: query
        description: Start Time in UTC (YYYY-MM-DDThh:mm:ss)
        schema:
          type: string
      - name: endTimeUtc
        in: query
        description: End Time in UTC (YYYY-MM-DDThh:mm:ss)
        schema:
          type: string
      - name: timeInterval
        in: query
        description: Time interval window to aggregate data (refer InternalLink[Real User Application Enumeration,operations-tag-RealUser,operations-RealUser-get_v2_realuser_explorer_enumeration])
        schema:
          type: integer
          format: int32
      - name: siteIds
        in: query
        description: Comma-separated list of site IDs to get favorite chart data for.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
      security:
      - bearer: []
      order: 3
  /v2/realuser/explorer/data/{siteIds}:
    get:
      tags:
      - RealUser
      summary: Returns the real user explorer data by site ID and filters.
      description: "*[Analytics Endpoint]*\r\n            \r\n**Note:**\r\n- Time interval \"Second\" is only valid for timeframes less than or equal to 30 minutes.\r\n- Similarly, time interval \"Minutes1\" is only valid for timeframes less than or equal to 12 hours.\r\n- Using these time intervals with other timeframes will result in an error response."
      parameters:
      - name: siteIds
        in: path
        description: Comma-separated list of site IDs
        required: true
        schema:
          type: string
      - name: startTimeUtc
        in: query
        description: Start Time in UTC (YYYY-MM-DDThh:mm:ss)
        schema:
          type: string
          format: date-time
      - name: endTimeUtc
        in: query
        description: End Time in UTC (YYYY-MM-DDThh:mm:ss)
        schema:
          type: string
          format: date-time
      - name: subSourceTypeId
        in: query
        description: Sub Source Type ID to return Sub Source Data. “1” for Provider; “2” for Ajax; “6” for Zone
        schema:
          type: integer
          format: int32
      - name: timeInterval
        in: query
        description: Time interval window to aggregate data (refer InternalLink[Real User Application Enumeration,operations-tag-RealUser,operations-RealUser-get_v2_realuser_explorer_enumeration])
        schema:
          type: integer
          format: int32
      - name: dimensionIds
        in: query
        description: Comma-separated list of Dimension IDs (refer InternalLink[Real User Application Enumeration,operations-tag-RealUser,operations-RealUser-get_v2_realuser_explorer_enumeration])
        schema:
          type: string
      - name: metricIds
        in: query
        description: Comma-separated list of metric IDs (refer InternalLink[Real User Application Enumeration,operations-tag-RealUser,operations-RealUser-get_v2_realuser_explorer_enumeration]). Default metrics based on SubSourceTypeId are returned if no value is passed.
        schema:
          type: string
      - name: tracepointIds
        in: query
        description: Comma-separated list of Tracepoint IDs
        schema:
          type: string
      - name: indicatorIds
        in: query
        description: Comma-separated list of Indicator IDs
        schema:
          type: string
      - name: zoneTypeIds
        in: query
        description: Comma-separated list of Zone Type IDs. ”-2” for Self Zone and “-3” for Third Party Zone.
        schema:
          type: string
      - name: filters
        in: query
        description: Add filter dimension, filter value and flag
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Models.v2_0.RealUser.RumFilterAPIModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.AnalyticsApiResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.AnalyticsResponseAggregated]]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.AnalyticsApiResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.AnalyticsResponseAggregated]]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.AnalyticsApiResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.AnalyticsResponseAggregated]]'
      security:
      - bearer: []
      order: 4
  /v2/realuser/favoritechart/defaultdata/{favoriteChartId}:
    get:
      tags:
      - RealUser
      summary: Returns the real user favorite chart default data set by the user when the favorite chart was created based on the ID.
      description: "*[Analytics Endpoint]*\r\n            \r\nThe favorite chart data returned is in UTC time."
      parameters:
      - name: favoriteChartId
        in: path
        description: Real user favorite chart ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.FavoriteChart.FavoriteChartDetailsResponse]'
      security:
      - bearer: []
      order: 5
  /v2/realuser/explorer/enumeration:
    get:
      tags:
      - RealUser
      summary: Returns the real user enumeration details for automation.
      description: Use parameters to specify which enumeration to pull, if no parameter is passed then it returns all the enumerations. Returns the enumeration based on the parameters.
      parameters:
      - name: subSourceId
        in: query
        description: Sub Source Type ID to return Sub Source Data. “1” for Provider; “2” for Ajax; “6” for Zone
        schema:
          type: integer
          format: int32
      - name: includeDimensions
        in: query
        description: Set to “true” to return enumerations of dimensions.
        schema:
          type: boolean
      - name: includeMetrics
        in: query
        description: Set to “true” to return enumerations of metrics.
        schema:
          type: boolean
      - name: includeSubSourceTypes
        in: query
        description: Set to “true” to return enumerations of sub sources.
        schema:
          type: boolean
      - name: includeTimeIntervals
        in: query
        description: Set to “true” to return enumerations of time intervals.
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.EnumerationResponse]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.EnumerationResponse]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.EnumerationResponse]'
      security:
      - bearer: []
      order: 6
