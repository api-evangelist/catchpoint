openapi: 3.0.1
info:
  title: Catchpoint REST API v2.0 Account UsageReport API
  version: '2.0'
servers:
- url: /api
tags:
- name: UsageReport
paths:
  /v2/account/usagereport:
    get:
      tags:
      - UsageReport
      summary: Returns the Usage Report
      description: " Return usage report for the provided parameters.  \r\nThe parameters are optional, and you may include either of them to customize the query.If no parameters are passed, then usage report by months is returned."
      parameters:
      - name: dataByDays
        in: query
        description: Usage Report of last 7 days including the present day.
        schema:
          type: boolean
      - name: dataByWeeks
        in: query
        description: Usage Report of last 5 weeks including present week.
        schema:
          type: boolean
      - name: dataByMonths
        in: query
        description: Usage Report of last 4 Months including the current month.
        schema:
          type: boolean
      - name: dataByQuarters
        in: query
        description: Usage Report of last 3 quarters including current quarter.
        schema:
          type: boolean
      - name: divisionId
        in: query
        description: Division id of which usage report Required
        schema:
          type: integer
          format: int32
      - name: productId
        in: query
        description: ProductId if which usage report required
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.UsageReportResponseModel]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.UsageReportResponseModel]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.UsageReportResponseModel]'
      security:
      - bearer: []
      order: 1
components:
  schemas:
    Catchpoint.Symphony.REST.Api.ApiUsageStatistics:
      type: object
      properties:
        clientId:
          type: integer
          format: int64
        lastRequestTimestamp:
          type: string
          format: date-time
        limits:
          $ref: '#/components/schemas/Catchpoint.Symphony.REST.Api.Limit'
        runs:
          $ref: '#/components/schemas/Catchpoint.Symphony.REST.Api.Limit'
        exceededMessage:
          type: string
          nullable: true
          readOnly: true
        divisionUsageStatistics:
          type: array
          items:
            $ref: '#/components/schemas/Catchpoint.Symphony.REST.Api.DivisionUsageStatistics'
          nullable: true
      additionalProperties: false
    Catchpoint.Symphony.REST.Api.DivisionUsageStatistics:
      type: object
      properties:
        divisionId:
          type: integer
          format: int32
        consumerStatistics:
          type: array
          items:
            $ref: '#/components/schemas/Catchpoint.Symphony.REST.Api.ConsumerStatistics'
          nullable: true
      additionalProperties: false
    Catchpoint.Symphony.REST.Common.Models.PatchIgnoredPath:
      type: object
