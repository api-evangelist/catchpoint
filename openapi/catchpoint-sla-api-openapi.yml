openapi: 3.2.0
info:
  title: Catchpoint REST API v2.0 SLA API
  version: '2.0'
servers:
- url: /api
tags:
- name: SLA
paths:
  /v2/slapurgeitems/{ids}:
    get:
      tags:
      - SLA
      summary: Return SLA purge item details by the IDs passed
      parameters:
      - name: ids
        in: path
        description: Comma-separated list of SLA purge item IDs
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
      security:
      - bearer: []
      order: 1
      operationId: getV2SlapurgeitemsByIds
      x-operation-id-source: derived
  /v2/slapurgeitems:
    get:
      tags:
      - SLA
      summary: Returns Schedule details by parameters passed
      parameters:
      - name: statusId
        in: query
        description: SLA purge item Status Type. “0” for Active; “1” for Inactive.
        schema:
          type: integer
          format: int32
      - name: purgeTypeId
        in: query
        description: Purge Type. “0” for AllRuns; “1” for FailedRunsOnly
        schema:
          type: integer
          format: int32
      - name: startTime
        in: query
        description: SLA purge item Start time in UTC (YYYY-MM-DDThh:mm:ss).
        schema:
          type: string
          format: date-time
      - name: endTime
        in: query
        description: SLA purge item End time in UTC (YYYY-MM-DDThh:mm:ss).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
      security:
      - bearer: []
      order: 2
      operationId: getV2Slapurgeitems
      x-operation-id-source: derived
    post:
      tags:
      - SLA
      summary: Create an SLA purge item based on the PostData
      description: To get payload for creating a new SLA purge item and to get the created SLA purge item details refer InternalLink[SLA purge item by ID Endpoint,operations-tag-SLAClassification,operations-SLAClassification-get_v2_slapurgeitems__ids_]. Pass “0” for SLA purge item ID to create a new SLA purge item.
      parameters:
      - name: objectDetails
        in: query
        description: Set to true to return the created object in the response body, otherwise the response body will only return created object ID.
        schema:
          type: boolean
      - name: isConsentAgreed
        in: query
        description: Set to true always when an SLA purge item is created from REST API.
        schema:
          type: boolean
          default: true
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Requests.v2_0.SLAItemAPIModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Requests.v2_0.SLAItemAPIModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Requests.v2_0.SLAItemAPIModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Requests.v2_0.SLAItemAPIModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.SLAItemResponseModel'
      security:
      - bearer: []
      order: 3
      operationId: postV2Slapurgeitems
      x-operation-id-source: derived
  /v2/slapurgeitems/status:
    patch:
      tags:
      - SLA
      summary: Update the status of existing SLA purge items based on the request body
      parameters:
      - name: isConsentAgreed
        in: query
        description: Set to true always when an SLA purge item is created from REST API.
        schema:
          type: boolean
          default: true
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Requests.v2_0.SLAPurgeItemPutModel'
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Requests.v2_0.SLAPurgeItemPutModel'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Requests.v2_0.SLAPurgeItemPutModel'
          application/*+json:
            schema:
              type: array
              items:
