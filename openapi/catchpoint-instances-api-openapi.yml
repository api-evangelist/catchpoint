openapi: 3.2.0
info:
  title: Catchpoint REST API v2.0 Instances API
  version: '2.0'
servers:
- url: /api
tags:
- name: Instances
paths:
  /v2/instances/{nodeIds}:
    get:
      tags:
      - Instances
      summary: Return details of the Node and all associated Instances
      description: Works only on Enterprise Nodes.
      parameters:
      - name: nodeIds
        in: path
        description: Comma-separated list of Node IDs
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.NodeInstanceResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.NodeInstanceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.NodeInstanceResponse'
      security:
      - bearer: []
      order: 1
      operationId: getV2InstancesByNodeIds
      x-operation-id-source: derived
  /v2/instances:
    get:
      tags:
      - Instances
      summary: Returns the Instance details based on the parameters passed
      description: 'Works only on Enterprise Nodes.


        When no parameter is passed, all Instances within the Client or Division are returned.'
      parameters:
      - name: name
        in: query
        description: Instance Name
        schema:
          type: string
      - name: nodeId
        in: query
        description: Node ID
        schema:
          type: integer
          format: int32
      - name: statusId
        in: query
        description: Instance Status. “0” for Active; “1” for Inactive
        schema:
          type: integer
          format: int32
      - name: core
        in: query
        description: Comma-separated list of core values
        schema:
          type: string
      - name: os
        in: query
        description: Comma-separated list of OS names
        schema:
          type: string
      - name: memory
        in: query
        description: Memory value
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: Page number to return records from when the number of records exceeds pageSize
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Number of results that is returned per page. Maximum value is 100.
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.InstanceResponse_1_System.Collections.Generic.List_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Node.InstanceResponseModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.InstanceResponse_1_System.Collections.Generic.List_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Node.InstanceResponseModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse_1_Catchpoint.Symphony.REST.Common.Response.v2_0.InstanceResponse_1_System.Collections.Generic.List_1_Catchpoint.Symphony.REST.Common.Response.v2_0.Node.InstanceResponseModel'
      security:
      - bearer: []
      order: 2
      operationId: getV2Instances
      x-operation-id-source: derived
    post:
      tags:
      - Instances
      summary: Create a new instance within a new node or add a new instance to an existing…
      description: 'Works only on Enterprise Nodes.


        To get payload for creating a new instance and to get the created instance details refer InternalLink[Instance Details By Node ID Endpoint,operations-tag-Instance,operations-Instance-get_v2_instances__nodeIds_]. Pass “0” for instance ID to create a new instance.'
      parameters:
      - name: objectDetails
        in: query
        description: Set to true to return the created object in the response body, otherwise the response body will only return created object ID.
        schema:
          type: boolean
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Node.InstanceResponseModel'
          application/json-patch+json:
