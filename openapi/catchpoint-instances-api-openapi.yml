      security:
      - bearer: []
      order: 5
  /v2/instances/status:
    patch:
      tags:
      - Instances
      summary: Allows to set the status of an existing instance to Active or Inactive.
      description: "Works only on Enterprise and Customer owned Nodes.\r\n            \r\nTo get payload for updating an Instance Status refer InternalLink[Instance Status Endpoint,operations-tag-Instance,operations-Instance-get_v2_instances_status__instanceIds_]. Status ID values – “0” for Active; “1” for Inactive. There can be multiple instances in the payload for which the status update is intended."
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Node.StatusModel'
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Node.StatusModel'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Node.StatusModel'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.v2_0.Node.StatusModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.InstanceResponse`1[System.Collections.Generic.List`1[System.Int32]]]'
            text/plain:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.InstanceResponse`1[System.Collections.Generic.List`1[System.Int32]]]'
            text/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.InstanceResponse`1[System.Collections.Generic.List`1[System.Int32]]]'
      security:
      - bearer: []
      order: 6
  /v2/instances/hardware/{nodeId}:
    get:
      tags:
      - Instances
      summary: Returns the instance hardware usage based on the Node ID.
      description: "Works only on Enterprise Nodes.\r\n            \r\nThe maximum time range allowed is 7 days over the period of last 365 days."
      parameters:
      - name: nodeId
        in: path
        description: Node ID
        required: true
        schema:
          type: integer
          format: int32
      - name: startDate
        in: query
        description: Start date in UTC (YYYY-MM-DDThh:mm)
        schema:
          type: string
      - name: endDate
        in: query
        description: End date in UTC (YYYY-MM-DDThh:mm)
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catchpoint.Symphony.REST.Common.Response.APIResponse`1[Catchpoint.Symphony.REST.Common.Response.v2_0.InstanceUsageResponse]'
            text/plain:
              schema:
